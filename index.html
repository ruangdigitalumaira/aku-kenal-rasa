<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#e8f7ff">
<title>Aku Kenal Rasa! — Ruang Digital Umaira</title>
<style>
:root{--ink:#34506b;--blue:#4b9dcc;--sky:#e7f6ff;--pink:#ffe6ef;--mint:#e7fbf2;--gold:#ffe8a8;--purple:#eee8ff;--line:#d6eaf5;--shadow:0 18px 44px rgba(74,123,151,.16)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#eaf8ff;font-family:ui-rounded,system-ui,-apple-system,sans-serif;color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0;overflow-x:hidden}
 .app{position:relative;width:min(760px,100%);min-height:100vh;background:rgba(255,255,255,.91);backdrop-filter:blur(2px);border:0;border-radius:0;padding:clamp(16px,4vw,30px);box-shadow:none;outline:none}
.app:before,.app:after{display:none}
.brand{text-align:center;color:#287f9b;font-weight:900;letter-spacing:.06em;font-size:.78rem;margin:0 auto 8px}.brand img{display:block;width:min(230px,68%);max-height:112px;object-fit:contain;margin:0 auto 4px}
h1{text-align:center;color:#398bb7;font-size:clamp(2rem,7vw,3.2rem);line-height:1.08;margin:8px 0 12px;text-shadow:0 3px 0 #e6f5ff}
.sub{text-align:center;line-height:1.65;max-width:540px;margin:0 auto;color:#5b7184}
.toolbar{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin:20px 0 24px}
.small{border:1.5px solid #d8eaf4;background:#f5fbff;color:#345f79;border-radius:999px;padding:10px 14px;font-weight:800;cursor:pointer;box-shadow:0 3px 0 #e3eef5;transition:transform .15s,box-shadow .15s}
.small:hover,.answer:hover{transform:translateY(-2px);box-shadow:0 5px 0 #e3eef5}
.start,.end{text-align:center;padding:clamp(12px,3vw,24px) 8px}
.emoji{font-size:clamp(3.4rem,14vw,6rem);line-height:1.25;margin:12px 0 16px;filter:drop-shadow(0 4px 0 rgba(70,120,150,.07))}
.bubble{display:inline-block;background:linear-gradient(135deg,#ffe8f0,#fff0d3);border:1px solid #ffdfeb;border-radius:20px;padding:13px 18px;font-weight:900;margin:8px auto;color:#77556a}
.main{background:linear-gradient(135deg,#4b9dcc,#6bb8d8);color:white;border:0;border-radius:999px;padding:14px 24px;font-weight:900;font-size:1rem;cursor:pointer;margin:14px 0 6px;box-shadow:0 5px 0 #347fa5,0 10px 20px #4b9dcc25;transition:transform .15s,box-shadow .15s}
.main:hover{transform:translateY(-2px);box-shadow:0 7px 0 #347fa5,0 12px 22px #4b9dcc2b}.main:active{transform:translateY(2px);box-shadow:0 2px 0 #347fa5}.main:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.row{display:flex;justify-content:space-between;gap:10px;font-weight:900;font-size:.9rem;margin-bottom:10px;color:#57748a}
.track{height:12px;background:#edf3f6;border-radius:99px;overflow:hidden;margin-bottom:22px;border:1px solid #e1edf2}
.fill{height:100%;background:linear-gradient(90deg,#72c9e6,#f4a8c4,#f6d274);width:0;border-radius:99px;transition:width .3s}
.panel{position:relative;background:url("assets/background-soal.png") center center/100% 100% no-repeat;border:2px solid white;border-radius:26px;padding:clamp(24px,5vw,38px) clamp(12px,3vw,22px);text-align:center;box-shadow:inset 0 0 0 1px #dcecf5;min-height:450px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}.question-content{width:100%;max-width:590px;background:rgba(255,255,255,.94);border:2px solid rgba(255,255,255,.98);border-radius:22px;padding:clamp(14px,3.5vw,24px);box-shadow:0 5px 18px rgba(74,123,151,.12)}.panel .emoji{font-size:clamp(2.6rem,10vw,4.4rem);line-height:1.05;margin:0 auto 10px}.panel .prompt{padding:8px 10px;border-radius:14px;background:rgba(255,255,255,.96);overflow-wrap:anywhere}.panel p{margin:12px 0 6px}.panel .answers{margin-top:12px}.panel .feedback{margin:12px 0 4px}
.prompt{font-size:clamp(1.25rem,4.5vw,1.7rem);font-weight:900;line-height:1.35;color:#34506b;text-shadow:0 1px 0 rgba(255,255,255,.85)}
.panel p{color:#4c6579;line-height:1.5;font-weight:700}
.answers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;margin-top:18px}
.answer{border:2px solid #d2e8f3;background:rgba(255,255,255,.95);color:#345b78;padding:15px 8px;border-radius:18px;font-size:1rem;font-weight:900;cursor:pointer;min-height:64px;box-shadow:0 4px 0 #dcecf4;transition:transform .15s,box-shadow .15s,border-color .15s;overflow-wrap:anywhere}
.answer:nth-child(2){background:rgba(255,249,252,.96);border-color:#f5d6e3;box-shadow:0 4px 0 #f7e6ed}.answer:nth-child(3){background:rgba(245,255,249,.96);border-color:#d5eee1;box-shadow:0 4px 0 #e0f2e8}
.answer:disabled{opacity:1;cursor:default}.answer:disabled:hover{transform:none}
.feedback{font-weight:900;line-height:1.5;min-height:34px;margin:17px 0 5px;padding:5px;border-radius:12px;background:rgba(255,255,255,.82)}.good{color:#218454}.try{color:#a65a2c}
.footer{text-align:center;font-size:.82rem;line-height:1.7;color:#7893a1;margin-top:22px;padding-top:16px;border-top:1px dashed #dceaf0}

.intro-screen{position:fixed;inset:0;width:100vw;height:100dvh;min-height:100vh;padding:0;margin:0;z-index:20;overflow:hidden;background:#bfeeff}
.intro-background{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block}
.hotspot{position:absolute;z-index:2;border:0;background:transparent;border-radius:999px;cursor:pointer;padding:0;outline-offset:3px}
.begin-hotspot{left:28%;top:49%;width:44%;height:10%}
.music-hotspot{right:14%;top:1.5%;width:11%;height:5.5%}
.voice-hotspot{right:2%;top:1.5%;width:11%;height:5.5%}
.repeat-hotspot{right:2%;top:1.5%;width:11%;height:5.5%}
.intro-screen button:focus-visible{outline:3px solid #fff;box-shadow:0 0 0 5px #347fa5}
.game-brand,.game-heading,.game-sub,.game-toolbar{display:none;margin-top:12px}
body.playing{padding:14px;background:linear-gradient(135deg,#e8f7ff,#fff4f8)}
body.playing .app{width:min(760px,100%);min-height:auto;background:rgba(255,255,255,.94);border:3px solid white;border-radius:28px;padding:clamp(16px,4vw,30px);box-shadow:var(--shadow);outline:1px solid #dcecf4}
body.playing .game-brand,body.playing .game-heading,body.playing .game-sub,body.playing .game-toolbar{display:block}
body.playing .game-toolbar{display:flex}
body.playing .intro-screen{display:none}
@media(max-width:520px){body.playing{padding:8px}body.playing .app{border-radius:22px;padding:16px 12px}.intro-background{object-fit:fill}}

[hidden]{display:none!important}
@media(max-width:520px){body{padding:10px}.app{border-radius:25px;padding:20px 15px}.app:before{top:10px;left:12px;font-size:22px}.app:after{top:30px;right:12px;font-size:18px}.brand{font-size:.7rem;letter-spacing:.08em}.toolbar{gap:7px;margin:17px 0 20px}.small{font-size:.82rem;padding:9px 11px}.answers{grid-template-columns:1fr;gap:10px}.answer{min-height:54px;padding:12px}.panel{border-radius:22px;min-height:570px;padding:18px 10px;background-size:100% 100%}.question-content{padding:13px 11px;border-radius:17px}.panel .emoji{font-size:2.8rem;margin-bottom:8px}.panel .prompt{font-size:1.2rem;line-height:1.35;padding:8px}.row{font-size:.82rem}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}

/* Perbaikan terbaru: layar bermain portrait penuh, tanpa scroll, papan di tengah, ikon kontrol di atas */
@media (max-width: 900px) {
  html, body { width:100%; height:100%; }
  body.playing { width:100%; height:100dvh; min-height:100dvh; max-height:100dvh; padding:0; margin:0; overflow:hidden; display:block; background:#dff4ff; }
  body.playing .app { width:100%; height:100dvh; min-height:0; max-height:100dvh; margin:0; padding:54px 10px 8px; border:0; border-radius:0; outline:0; box-shadow:none; background:linear-gradient(180deg,#e5f7ff 0%,#fff4f8 100%); overflow:hidden; display:flex; flex-direction:column; align-items:stretch; }
  body.playing .game-brand, body.playing .game-heading, body.playing .game-sub { display:none !important; }
  body.playing .game-toolbar { position:absolute; z-index:10; top:8px; right:10px; display:flex; justify-content:flex-end; gap:8px; margin:0; width:auto; }
  body.playing .game-toolbar .small { width:40px; height:40px; padding:0; display:flex; align-items:center; justify-content:center; border-radius:50%; font-size:0; line-height:1; background:rgba(255,255,255,.94); border:2px solid #fff; box-shadow:0 2px 8px #5085a333; }
  body.playing #voiceLabel::before { content:'🔊'; font-size:20px; }
  body.playing #musicLabel::before { content:'🎵'; font-size:20px; }
  body.playing #repeatLabel::before { content:'🔁'; font-size:19px; }
  body.playing #homeLabel::before { content:'🏠'; font-size:20px; }
  body.playing #game { flex:1; min-height:0; width:100%; display:flex; flex-direction:column; overflow:hidden; }
  body.playing #game[hidden] { display:none !important; }
  body.playing .row { flex:0 0 auto; margin:0 3px 6px; font-size:.78rem; }
  body.playing .track { flex:0 0 7px; height:7px; margin:0 3px 7px; }
  body.playing .panel { flex:1; min-height:0; width:100%; padding:8px; border-radius:22px; background-position:center; background-size:100% 100%; display:flex; justify-content:center; overflow:hidden; }
  body.playing .question-content { width:100%; max-width:620px; max-height:100%; overflow:auto; scrollbar-width:none; padding:clamp(8px,2.2vh,16px) clamp(8px,2.5vw,16px); border-radius:18px; }
  body.playing .question-content::-webkit-scrollbar { display:none; }
  body.playing .panel .emoji { font-size:clamp(2rem,7vh,3.2rem); margin:0 auto 4px; line-height:1; }
  body.playing .panel .prompt { font-size:clamp(1rem,3.1vh,1.4rem); padding:6px 7px; line-height:1.22; }
  body.playing .panel p { font-size:clamp(.75rem,1.8vh,.9rem); line-height:1.25; margin:5px 0 2px; }
  body.playing .answers { grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; margin-top:7px; }
  body.playing .answer { min-height:clamp(43px,8vh,58px); padding:7px 4px; font-size:clamp(.72rem,2.1vh,.95rem); border-radius:12px; line-height:1.15; }
  body.playing .feedback { min-height:0; margin:6px 0 2px; padding:4px; font-size:clamp(.74rem,1.8vh,.9rem); line-height:1.25; }
  body.playing #next, body.playing #again { margin:6px 0 0; padding:10px 18px; font-size:.9rem; }
  body.playing .footer { display:none; }
  body.playing .end { flex:1; overflow:auto; padding:10px 6px; }
}
@media (max-width: 380px) {
  body.playing .app { padding-left:7px; padding-right:7px; }
  body.playing .panel { padding:5px; }
  body.playing .question-content { padding:7px 6px; }
  body.playing .answer { font-size:.7rem; }
}


/* Status visual: ikon diberi garis merah saat suara atau musik mati */
.hotspot.voice-hotspot::after,
.hotspot.music-hotspot::after {
  content: "";
  position: absolute;
  left: 48%;
  top: 13%;
  height: 74%;
  width: 5px;
  border-radius: 99px;
  background: #e53935;
  border: 1px solid #fff;
  box-shadow: 0 1px 3px rgba(0,0,0,.35);
  transform: rotate(-42deg);
  opacity: 0;
  pointer-events: none;
}
.hotspot.voice-hotspot.is-off::after,
.hotspot.music-hotspot.is-off::after { opacity: 1; }

#voiceLabel.is-off::after,
#musicLabel.is-off::after {
  content: "";
  position: absolute;
  width: 4px;
  height: 25px;
  border-radius: 99px;
  background: #e53935;
  border: 1px solid #fff;
  box-shadow: 0 1px 3px rgba(0,0,0,.25);
  transform: rotate(-42deg);
  pointer-events: none;
}
#voiceLabel, #musicLabel { position: relative; }
body.playing #voiceLabel.is-off::after,
body.playing #musicLabel.is-off::after {
  width: 4px;
  height: 25px;
}

</style>
</head>
<body>
<main class="app">
<section id="start" class="start intro-screen" aria-label="Halaman pembuka Aku Kenal Rasa">
  <img class="intro-background" src="assets/background-rasa.png" alt="Ilustrasi halaman pembuka Aku Kenal Rasa">
  <button class="hotspot home-hotspot" id="homeHotspot" aria-label="Kembali ke halaman pembuka" hidden></button>
  <button class="hotspot music-hotspot is-off" id="music" aria-label="Nyalakan atau matikan musik" aria-pressed="false"></button>
  <button class="hotspot voice-hotspot" id="voice" aria-label="Nyalakan atau matikan suara"> </button>
  <button class="hotspot begin-hotspot" id="begin" aria-label="Mulai bermain"></button>
  <button class="hotspot repeat-hotspot" id="repeat" aria-label="Ulangi suara pertanyaan" hidden></button>
</section>
<div class="brand game-brand"><img src="assets/logo-ruang-digital-umaira.png" alt="Ruang Digital Umaira"><span>GAME EDUKASI ANAK</span></div>
<h1 class="game-heading">🍋 Aku Kenal Rasa!</h1>
<p class="sub game-sub">Game kecil untuk mengenal rasa dan benda di sekitar kita. Dengarkan, pikirkan, lalu pilih jawaban.</p>
<div class="toolbar game-toolbar"><button class="small" id="homeLabel" aria-label="Kembali ke halaman pembuka" title="Halaman pembuka">🏠 Beranda</button><button class="small" id="voiceLabel" aria-label="Matikan suara" title="Aktif/nonaktif suara">🔊 Suara: aktif</button><button class="small is-off" id="musicLabel" aria-label="Nyalakan musik" title="Aktif/nonaktif musik">🎵 Musik: mati</button><button class="small" id="repeatLabel" aria-label="Ulangi suara pertanyaan" title="Ulangi suara">🔁 Ulangi suara</button></div>
<audio id="bgMusic" src="assets/aku-kenal-rasa-musik-original.wav" loop preload="none"></audio>
<section id="game" hidden><div class="row"><span id="count"></span><span id="score"></span></div><div class="track"><div class="fill" id="fill"></div></div><div class="panel"><div class="question-content"><div class="emoji" id="emoji"></div><div class="prompt" id="prompt"></div><p>Pilih jawaban yang menurutmu benar, ya!</p><div class="answers" id="answers"></div><div class="feedback" id="feedback" aria-live="polite"></div><button class="main" id="next" disabled>Berikutnya ➜</button></div></div></section>
<section id="end" class="end" hidden><div class="emoji">🌟🎉🌈</div><h2>Hebat! Kamu sudah selesai bermain!</h2><p id="final"></p><div class="bubble" id="encourage">Terus belajar dengan gembira!</div><br><button class="main" id="again">Main Lagi 🔄</button></section>
<div class="footer">Belajar sedikit demi sedikit, tumbuh bersama. 💗</div>
</main>
<script>
const qs=[
["🧂","Apa rasa garam?",["Manis","Asin","Asam"],1,"Garam rasanya asin."],
["🍯","Apa rasa madu?",["Manis","Pahit","Asin"],0,"Madu biasanya terasa manis."],
["🍋","Apa rasa lemon?",["Asin","Asam","Manis"],1,"Lemon biasanya terasa asam."],
["🍫","Cokelat susu biasanya terasa…",["Manis","Pedas","Asin sekali"],0,"Cokelat susu biasanya terasa manis."],
["🌶️","Cabai bisa terasa…",["Dingin","Pedas","Manis"],1,"Cabai dapat terasa pedas. Tidak perlu mencobanya."],
["🥒","Acar yang memakai cuka sering terasa…",["Asam","Pahit","Manis sekali"],0,"Cuka memiliki rasa asam."],
["🍲","Sup yang diberi garam bisa terasa…",["Asin","Manis seperti permen","Pahit seperti kopi"],0,"Garam membuat sup terasa lebih asin."],
["☕","Kopi hitam tanpa gula biasanya terasa…",["Manis","Pahit","Asam seperti lemon"],1,"Kopi hitam biasanya terasa pahit."],
["🥛","Susu tawar biasanya rasanya…",["Sangat pedas","Tawar atau sedikit gurih","Asin sekali"],1,"Susu tawar biasanya tidak semanis susu berperisa."],
["🥭","Mangga matang biasanya terasa…",["Manis","Pahit","Pedas"],0,"Mangga matang biasanya terasa manis."],
["🍬","Permen biasanya terasa…",["Manis","Asin","Pedas"],0,"Permen biasanya terasa manis."],
["🥔","Keripik kentang yang diberi garam terasa…",["Asin","Manis seperti madu","Pahit seperti kopi"],0,"Garam membuat keripik terasa asin."],
["🍦","Es krim vanila biasanya terasa…",["Pedas","Manis","Asin sekali"],1,"Es krim vanila biasanya terasa manis."],
["🥣","Yoghurt tawar bisa terasa sedikit…",["Asam","Pedas","Asin sekali"],0,"Yoghurt tawar sering terasa sedikit asam."],
["💧","Air putih bersih biasanya terasa…",["Manis sekali","Asin","Tawar"],2,"Air putih biasanya terasa tawar."]
];
let i=0,pts=0,done=false,voiceOn=true,last="";
const el=id=>document.getElementById(id);
function say(t){last=t;if(!voiceOn||!window.speechSynthesis)return;window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="id-ID";u.rate=.88;u.pitch=1.08;let v=speechSynthesis.getVoices().find(x=>x.lang&&x.lang.toLowerCase().startsWith("id"));if(v)u.voice=v;speechSynthesis.speak(u)}
function render(){done=false;let q=qs[i];el("count").textContent=`Pertanyaan ${i+1} dari ${qs.length}`;el("score").textContent=`Skor: ${pts}`;el("fill").style.width=(i/qs.length*100)+"%";el("emoji").textContent=q[0];el("prompt").textContent=q[1];el("feedback").textContent="";el("feedback").className="feedback";el("next").disabled=true;el("next").textContent=i===qs.length-1?"Lihat Hasil 🌟":"Berikutnya ➜";el("answers").innerHTML="";q[2].forEach((a,n)=>{let b=document.createElement("button");b.className="answer";b.textContent=a;b.onclick=()=>choose(n);el("answers").appendChild(b)});say(q[1])}
function choose(n){if(done)return;done=true;let q=qs[i],bs=[...el("answers").querySelectorAll("button")],ok=n===q[3];bs.forEach(b=>b.disabled=true);if(ok){pts++;el("feedback").textContent="🎉 Betul! "+q[4];el("feedback").className="feedback good";say("Hebat! Betul. "+q[4])}else{el("feedback").textContent="😊 Belum tepat. "+q[4];el("feedback").className="feedback try";say("Tidak apa-apa, kita belajar bersama. "+q[4]);bs[q[3]].style.borderColor="#57b98a";bs[q[3]].style.background="#e5faee"}el("score").textContent="Skor: "+pts;el("fill").style.width=((i+1)/qs.length*100)+"%";el("next").disabled=false}
function start(){i=0;pts=0;document.body.classList.add("playing");el("start").hidden=false;el("end").hidden=true;el("game").hidden=false;render()}
function goHome(){if(window.speechSynthesis)window.speechSynthesis.cancel();el("game").hidden=true;el("end").hidden=true;el("start").hidden=false;document.body.classList.remove("playing");}
el("begin").onclick=start;el("again").onclick=start;el("homeLabel").onclick=goHome;el("next").onclick=()=>{if(!done)return;if(i<qs.length-1){i++;render()}else{el("game").hidden=true;el("end").hidden=false;el("final").textContent=`Kamu mendapat ${pts} dari ${qs.length} jawaban benar.`;el("encourage").textContent=pts===qs.length?"Luar biasa! Semua jawaban benar!":"Bagus sekali sudah mencoba. Kita bisa bermain lagi untuk belajar lebih banyak.";say("Permainan selesai. Kamu mendapat "+pts+" dari "+qs.length+". "+el("encourage").textContent)}};
function syncSoundIcons(){
  el("voice").classList.toggle("is-off",!voiceOn);
  el("voiceLabel").classList.toggle("is-off",!voiceOn);
  const musicOff=music.paused;
  el("music").classList.toggle("is-off",musicOff);
  el("musicLabel").classList.toggle("is-off",musicOff);
}
function toggleVoice(){voiceOn=!voiceOn;syncSoundIcons();el("voice").setAttribute("aria-label",voiceOn?"Matikan suara":"Nyalakan suara");el("voiceLabel").textContent=voiceOn?"🔊 Suara: aktif":"🔇 Suara: mati";el("voiceLabel").setAttribute("aria-label",voiceOn?"Matikan suara":"Nyalakan suara");if(!voiceOn&&window.speechSynthesis){speechSynthesis.cancel()}else{const onHome=!el("start").hidden&&!document.body.classList.contains("playing");say(onHome?"Halo, ayo bermain!":(last||"Halo, ayo bermain!"))}}
el("voice").onclick=toggleVoice;el("voiceLabel").onclick=toggleVoice;
function repeatVoice(){say(last||"Tekan Mulai Bermain untuk memulai.")}
el("repeat").onclick=repeatVoice;el("repeatLabel").onclick=repeatVoice;
const music=el("bgMusic");
music.volume=0.22;
async function toggleMusic(){if(music.paused){try{await music.play();syncSoundIcons();el("musicLabel").textContent="🎵 Musik: aktif";el("musicLabel").setAttribute("aria-label","Matikan musik");el("music").setAttribute("aria-pressed","true")}catch(e){el("musicLabel").textContent="🎵 Coba putar lagi";alert("Musik belum bisa diputar. Pastikan file musik ada di folder assets dan namanya sama persis.")} }else{music.pause();syncSoundIcons();el("musicLabel").textContent="🎵 Musik: mati";el("musicLabel").setAttribute("aria-label","Nyalakan musik");el("music").setAttribute("aria-pressed","false")}}
el("music").onclick=toggleMusic;el("musicLabel").onclick=toggleMusic;
music.addEventListener("play",syncSoundIcons);
music.addEventListener("pause",syncSoundIcons);
syncSoundIcons();
if(!("speechSynthesis"in window)){el("voice").setAttribute("aria-label","Suara tidak didukung");el("voiceLabel").textContent="🔈 Suara tidak didukung";el("voice").disabled=true;el("repeat").disabled=true}
</script>
</body>
</html>
